name = "inspire-company-os"
main = "src/entry.js"
compatibility_date = "2026-09-17"
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "v0"
AUTH_MODE = "access"
AI_MODEL = "@cf/zai-org/glm-4.7-flash"
AI_DAILY_REQUEST_SOFT_CAP = "50"
AI_EST_NEURONS_PER_REQUEST = "60"

[[routes]]
pattern = "ops.getinspration.com"
custom_domain = true

[[d1_databases]]
binding = "COMPANY_OS_DB"
database_name = "inspire-company-os-db"
# UUID-shaped sentinel: valid config shape for local tooling, explicitly blocked by predeploy.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[ai]
binding = "AI"

[triggers]
crons = ["*/15 * * * *"]
