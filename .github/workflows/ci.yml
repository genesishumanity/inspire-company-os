name: company-os-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run repository smoke checks
        run: npm run smoke
      - name: Verify Access guard fails closed
        run: node tests/auth-smoke.mjs
      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run --config wrangler.ci.toml --outdir /tmp/company-os-worker
      - name: Verify required Company OS docs
        run: |
          test -f docs/COMPANY_OS_ARCHITECTURE.md
          test -f docs/COMPANY_OS_COST_GUARDRAILS.md
          test -f docs/COMPANY_OS_PERMISSIONS.md
          test -f docs/COMPANY_OS_PROGRESS.md
